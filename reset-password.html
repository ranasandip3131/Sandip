
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Admin Password - Education Hub Nepal</title>
</head>
<body>
  <h1>Education Hub Nepal</h1>
  <h2>Set a New Admin Password</h2>

  <form id="resetForm">
    <p>
      <label for="newPassword">New Password</label><br>
      <input type="password" id="newPassword"
             minlength="8" required>
    </p>

    <p>
      <label for="confirmPassword">Confirm Password</label><br>
      <input type="password" id="confirmPassword"
             minlength="8" required>
    </p>

    <button type="submit">Update Password</button>
    <p id="message">Enter your new password.</p>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    document.getElementById("resetForm").addEventListener(
      "submit", async function(event) {
        event.preventDefault();

        const password = document.getElementById("newPassword").value;
        const confirm = document.getElementById("confirmPassword").value;
        const message = document.getElementById("message");

        if (password !== confirm) {
          message.textContent = "Passwords do not match.";
          return;
        }

        try {
          const { data: { session } } =
            await window.supabaseClient.auth.getSession();

          if (!session) {
            message.textContent =
              "Recovery session not found. Request a fresh reset email.";
            return;
          }

          const { error } =
            await window.supabaseClient.auth.updateUser({
              password: password
            });

          if (error) throw error;

          message.textContent =
            "Password updated successfully! You can now log in.";
        } catch (error) {
          message.textContent = "Error: " + error.message;
        }
      }
    );
  </script>
</body>
</html>
